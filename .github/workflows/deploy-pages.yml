name: Deploy to GitHub Pages

on:
  push:
    tags:
      - '*'          # деплой при создании любого тега (например, v1.0, 2026.09)
  workflow_dispatch:  # и вручную через Actions → Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # NB: блок environment специально не указан — github-pages environment
    # по умолчанию разрешает деплой только с ветки main и блокирует теги.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # автоматически включает Pages (Source: GitHub Actions) при первом запуске

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
